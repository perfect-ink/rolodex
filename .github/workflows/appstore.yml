# Builds the Mac App Store version of Rolodex (`make appstore`) and uploads it
# to App Store Connect, then pushes the listing in docs/app-store/ and submits
# the build for review. The Developer ID DMG is release.yml's job.
#
#   release published  -> upload <tag> (build number = this workflow's run number),
#   (not a pre-release)   push the listing, wait for Apple to process the build,
#                         then submit it; it goes live automatically once approved
#   manual run (tag)   -> same, for an existing tag; untick "submit" to stop at upload
#   PR touching this   -> dry run: archive and export only, no upload
#
# Everything is under team XS9W9A8FWM (the Makefile's TEAM_ID). Xcode creates
# the signing certificate and profile through the API key, so no .p12 is needed.
# Repository secrets, set by `make secrets` in perfect-ink/perfectink.org
# (skipped with a warning until the API key is set):
#
#   APP_STORE_CONNECT_API_KEY     base64 of the AuthKey_*.p8 (App Manager role)
#   APP_STORE_CONNECT_API_KEY_ID  the key's ID
#   APP_STORE_CONNECT_ISSUER_ID   the issuer ID shown above the keys list
#   APP_REVIEW_PHONE              App Review contact phone (kept out of the repo)
#
# App Store Connect → the one-time setup (app record, App Privacy, age rating)
# is listed in docs/app-store/README.md.
name: App Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and upload
        required: true
      submit:
        description: Submit for review once processed
        type: boolean
        default: true
  pull_request:
    paths: [.github/workflows/appstore.yml, Makefile, Scripts/ExportOptions-AppStore.plist, fastlane/**]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: appstore-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  appstore:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: macos-26
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
      version: ${{ steps.upload.outputs.version }}
      build: ${{ steps.upload.outputs.build }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || '' }}
      HAS_SECRETS: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' }}
    steps:
      - name: Check secrets
        if: env.HAS_SECRETS != 'true'
        run: echo "::warning::APP_STORE_CONNECT_API_KEY isn't set; skipping. See the top of .github/workflows/appstore.yml."

      - uses: actions/checkout@v5
        if: env.HAS_SECRETS == 'true'
        with:
          ref: ${{ env.TAG }}

      - name: Version
        if: env.HAS_SECRETS == 'true'
        run: |
          if [ -n "$TAG" ]; then VERSION="${TAG#v}"; else VERSION="$(sed -nE 's/^MARKETING_VERSION *= *//p' VERSION)"; fi
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::App Store versions must be like 1.2.0, got $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: API key
        if: env.HAS_SECRETS == 'true'
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          # altool finds the key by ID in ~/.appstoreconnect/private_keys; xcodebuild takes its path.
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
          echo "$API_KEY" | base64 --decode > "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive, sign and export
        if: env.HAS_SECRETS == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: make appstore VERSION="$VERSION" BUILD_NUMBER="$GITHUB_RUN_NUMBER" ASC_KEY_ID="$ASC_KEY_ID" ASC_ISSUER_ID="$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: env.HAS_SECRETS == 'true'
        with:
          name: Rolodex-${{ env.VERSION }}-appstore
          path: build/appstore/Rolodex.pkg

      - name: Upload to App Store Connect
        id: upload
        if: env.HAS_SECRETS == 'true' && env.TAG != ''
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --validate-app -f build/appstore/Rolodex.pkg -t macos --apiKey "$API_KEY_ID" --apiIssuer "$ISSUER_ID"
          xcrun altool --upload-app   -f build/appstore/Rolodex.pkg -t macos --apiKey "$API_KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "::notice::Uploaded Rolodex $VERSION ($GITHUB_RUN_NUMBER). It appears in App Store Connect once processing finishes."
          { echo "uploaded=true"; echo "version=$VERSION"; echo "build=$GITHUB_RUN_NUMBER"; } >> "$GITHUB_OUTPUT"

      - name: Upload listing (metadata and screenshots)
        if: env.HAS_SECRETS == 'true' && env.TAG != ''
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64: "true"
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          fastlane mac metadata version:"$VERSION"
          echo "::notice::Listing for $VERSION uploaded."

      - name: Remove API key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys

  submit:
    # Only real releases go to review: published releases, and manual runs that leave "submit" on.
    needs: appstore
    if: needs.appstore.outputs.uploaded == 'true' && (github.event_name == 'release' || inputs.submit)
    # Waiting on Apple's processing is mostly sleep, so it runs on the cheaper Linux runner.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64: "true"
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      VERSION: ${{ needs.appstore.outputs.version }}
      BUILD: ${{ needs.appstore.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install fastlane
        run: sudo gem install fastlane --no-document

      - name: Wait for processing
        run: fastlane mac wait_for_build version:"$VERSION" build:"$BUILD"

      - name: Submit for review
        run: |
          fastlane mac submit version:"$VERSION" build:"$BUILD"
          echo "::notice::Rolodex $VERSION ($BUILD) is in App Review and will be released automatically once approved."
