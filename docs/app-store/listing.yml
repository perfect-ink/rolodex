# App Review Information. The repo is public, so leave phone blank and set the
# APP_REVIEW_PHONE repository secret instead (it wins over this field).
review:
  first_name: Felix
  last_name: Dantoni
  email: hello@perfectink.org
  phone: ""
  demo_required: false   # no sign-in, so no demo account
  notes: |
    Rolodex is a contacts manager for the Mac. It reads and edits the system Contacts database through the Contacts framework; it has no database of its own for contacts.

    CONTACTS PERMISSION
    On first launch macOS asks for access to Contacts. Please allow it. If access is denied, Rolodex shows a button that opens System Settings → Privacy & Security → Contacts.

    HOW TO TEST
    1. Allow Contacts access. Your contacts appear in the list, with groups in the sidebar.
    2. Select a contact and edit a field, for example a phone number. The change is saved to Contacts.
    3. In a contact's Groups section, add the contact to a group.
    4. In the sidebar, create a Smart Group with a rule such as "Company contains Apple". Matching contacts appear in it.
    5. Open Insights at the top of the sidebar to see empty groups and contacts that belong to no group.

    ABOUT THE BUILD
    No account or sign-in. No data is collected or sent anywhere. The only network use is Apple Maps: the map pane shows a contact's address and geocodes it with MapKit. Smart group rules and hidden-group settings are saved in the app's sandbox container. Purchases: none.

    Contact for questions during review: hello@perfectink.org
