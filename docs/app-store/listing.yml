# Rolodex's whole App Store listing in one file: the text App Store Connect shows,
# the categories, and the App Review contact and notes. fastlane/Fastfile reads it
# and pushes it with every release, so App Store Connect always matches this file.
# Screenshots are the one thing elsewhere: screenshots/en-US/.
#
# Limits are Apple's; the Fastfile refuses to upload anything longer.

locale: en-US

name: "Rolodex: Contacts & Groups"     # 30, unique across the whole store
subtitle: "Smart groups for Contacts"  # 30

# 170. Can change any time without a new build or review.
promotional_text: "Browse and edit your Mac's contacts, build smart groups from rules, and keep your groups tidy with Group Insights. Works on the Contacts you already have."

# 4000
description: |
  Rolodex is a faster way to browse, edit and organize the contacts already on your Mac. It works directly on your Contacts, so every change shows up in the Contacts app and on your other devices through iCloud.

  SMART GROUPS
  • Build groups from rules, like everyone at a company or everyone with a job title
  • Smart groups update themselves as your contacts change

  GROUPS THAT ARE EASY TO MANAGE
  • Add a contact to any of your groups right from their card
  • Merge two groups into one
  • Group Insights finds empty groups, contacts in no group, and groups that overlap

  A CLEANER CONTACT LIST
  • Hide the members of chosen groups from All Contacts
  • Mark contacts as blocked so they stay out of your way in Rolodex

  QUICK EDITING
  • Edit names, phone numbers, emails, addresses, birthdays and more
  • Copy any field with one click
  • See a contact's address on a map
  • Share a contact as a vCard
  • Undo your last changes

  PRIVATE BY DESIGN
  Rolodex has no account and collects nothing. Your contacts stay in Contacts on your Mac. Smart group rules and hidden groups are saved on your Mac only.

  Rolodex asks for access to Contacts the first time you open it. You can change this any time in System Settings → Privacy & Security → Contacts.

# 100, comma separated, no spaces needed
keywords: "contacts,groups,address book,smart groups,organize,people,vcard,crm,contact manager,rolodex"

